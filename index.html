<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yifan Guan's academic homepage.">
  <title>Yifan Guan</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212f;
      --muted: #5d6878;
      --accent: #2d6cdf;
      --surface: rgba(255, 255, 255, 0.88);
      --line: rgba(24, 33, 47, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(45, 108, 223, 0.18), transparent 34%),
        radial-gradient(circle at 85% 80%, rgba(77, 178, 154, 0.16), transparent 30%),
        #f5f7fb;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(36px, 7vw, 72px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(32, 51, 84, 0.12);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 8vw, 5.2rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .affiliation {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.5vw, 1.28rem);
    }

    .intro {
      max-width: 42rem;
      margin: 30px 0;
      font-size: 1.04rem;
      line-height: 1.75;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      font-weight: 650;
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    a:hover,
    a:focus-visible {
      color: var(--accent);
      border-color: rgba(45, 108, 223, 0.45);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Academic Homepage</p>
    <h1>Yifan Guan</h1>
    <p class="affiliation">Northeastern University of China</p>
    <p class="intro">
      Student researcher interested in time-series analysis and multimodal learning.
    </p>
    <div class="links" aria-label="Contact and profile links">
      <a href="mailto:guanjy2@mails.neu.edu.cn">guanjy2@mails.neu.edu.cn</a>
      <a href="https://github.com/Augustus-G">GitHub</a>
    </div>
  </main>
</body>
</html>
